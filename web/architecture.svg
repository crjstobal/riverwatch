<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55626e"/></marker>
    <style>
      .box{fill:#fff;stroke:#c9d3db;stroke-width:1.5}
      .aws{fill:#fff7ec;stroke:#e8a33d;stroke-width:1.5}
      .cv{fill:#eaf4fb;stroke:#2f86c9;stroke-width:1.5}
      .ag{fill:#f1ecfb;stroke:#7a5cc4;stroke-width:1.5}
      .hu{fill:#eef7f0;stroke:#2e7d4f;stroke-width:1.5}
      .t{fill:#14202b;font-weight:600}
      .s{fill:#5b6b79;font-size:12px}
      .l{stroke:#55626e;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .zone{fill:none;stroke:#e8a33d;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#fbfcfd"/>

  <!-- sources -->
  <text x="20" y="34" class="t" font-size="15">Public data (USGS)</text>
  <rect x="20" y="50" width="236" height="78" rx="10" class="box"/>
  <text x="34" y="76" class="t">HIVIS river cameras</text>
  <text x="34" y="96" class="s">1 frame / 15 min, public S3 bucket</text>
  <text x="34" y="114" class="s">usgs-nims-images (NIMS API)</text>
  <rect x="20" y="146" width="236" height="62" rx="10" class="box"/>
  <text x="34" y="172" class="t">NWIS gage, same site</text>
  <text x="34" y="192" class="s">primary sensor, 5 to 15 min</text>
  <rect x="20" y="226" width="236" height="62" rx="10" class="box"/>
  <text x="34" y="252" class="t">NWIS gage, 12 km upstream</text>
  <text x="34" y="272" class="s">early warning of the wave</text>

  <!-- AWS zone -->
  <rect x="280" y="20" width="790" height="520" rx="16" class="zone"/>
  <text x="300" y="46" class="t" font-size="15" fill="#b26b00">AWS (eu-west-3)</text>

  <rect x="300" y="64" width="150" height="54" rx="10" class="aws"/>
  <text x="314" y="88" class="t">EventBridge</text>
  <text x="314" y="106" class="s">Scheduler, every 15 min</text>

  <!-- lambda -->
  <rect x="300" y="140" width="490" height="300" rx="12" class="aws"/>
  <text x="316" y="164" class="t">AWS Lambda, arm64 (Graviton), Python 3.12</text>

  <rect x="316" y="180" width="226" height="236" rx="10" class="cv"/>
  <text x="328" y="204" class="t">Perception: OpenCV 5.0.0</text>
  <text x="328" y="228" class="s">1  quality gate: IR night, blur,</text>
  <text x="328" y="244" class="s">    fog, contrast (Laplacian, HSV)</text>
  <text x="328" y="266" class="s">2  ECC registration on static</text>
  <text x="328" y="282" class="s">    structures (findTransformECC)</text>
  <text x="328" y="304" class="s">3  flowing-water mask: local NCC</text>
  <text x="328" y="320" class="s">    between frames (boxFilter)</text>
  <text x="328" y="342" class="s">4  waterline = median top edge</text>
  <text x="328" y="358" class="s">    (connectedComponents)</text>
  <text x="328" y="380" class="s">5  monotone calibration to stage</text>
  <text x="328" y="400" class="s">    + physics plausibility</text>

  <rect x="556" y="180" width="220" height="236" rx="10" class="ag"/>
  <text x="570" y="204" class="t">Agent loop (vendor-neutral)</text>
  <text x="570" y="228" class="s">tools: measure_camera,</text>
  <text x="570" y="244" class="s">view_camera_frame, get_gage,</text>
  <text x="570" y="260" class="s">get_upstream, set_watch_level,</text>
  <text x="570" y="276" class="s">flag_sensor_issue,</text>
  <text x="570" y="292" class="s">request_human_approval</text>
  <text x="570" y="318" class="t" font-size="13">Guardrails in code</text>
  <text x="570" y="338" class="s">2 confirmations to escalate</text>
  <text x="570" y="354" class="s">no lowering while a reading</text>
  <text x="570" y="370" class="s">still implies a higher level</text>
  <text x="570" y="390" class="s">8 model calls max per cycle</text>

  <rect x="820" y="180" width="230" height="74" rx="10" class="aws"/>
  <text x="834" y="206" class="t">Amazon Bedrock</text>
  <text x="834" y="226" class="s">Amazon Nova 2 Lite (Converse,</text>
  <text x="834" y="242" class="s">tool use, sees annotated frame)</text>

  <rect x="820" y="276" width="230" height="74" rx="10" class="aws"/>
  <text x="834" y="302" class="t">Amazon S3</text>
  <text x="834" y="322" class="s">agent state, traces, annotated</text>
  <text x="834" y="338" class="s">frames, status page</text>

  <rect x="820" y="372" width="230" height="62" rx="10" class="aws"/>
  <text x="834" y="398" class="t">Amazon SNS</text>
  <text x="834" y="418" class="s">approval requests and alerts</text>

  <rect x="560" y="462" width="210" height="62" rx="10" class="aws"/>
  <text x="574" y="488" class="t">CloudFront</text>
  <text x="574" y="508" class="s">status page + /api/decision</text>

  <rect x="820" y="462" width="230" height="62" rx="10" class="hu"/>
  <text x="834" y="488" class="t">Duty operator / public</text>
  <text x="834" y="508" class="s">approves alerts, reads status</text>

  <!-- arrows -->
  <path d="M256 89 H272 V198 H316" class="l"/>
  <path d="M256 177 H268" stroke="#55626e" stroke-width="1.6" fill="none"/>
  <path d="M256 257 H268" stroke="#55626e" stroke-width="1.6" fill="none"/>
  <path d="M268 177 V430 H650 V418" class="l"/>
  <path d="M375 118 V140" class="l"/>
  <path d="M542 298 H556" class="l"/>
  <path d="M776 217 H820" class="l"/>
  <path d="M776 313 H820" class="l"/>
  <path d="M776 400 H820" class="l"/>
  <path d="M935 434 V462" class="l"/>
  <path d="M770 493 H820" class="l"/>
  <path d="M900 350 C900 445 700 440 680 462" class="l"/>
  <text x="262" y="82" class="s">frames</text>
  <text x="276" y="424" class="s">gage readings</text>
</svg>
